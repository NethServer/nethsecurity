name: "python3-nethsec tests"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/python3-nethsec-tests.yml"
      - "packages/python3-nethsec/**"
  pull_request:
    paths:
      - ".github/workflows/python3-nethsec-tests.yml"
      - "packages/python3-nethsec/**"

jobs:
  run_tests:
    name: "Run tests"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/python3-nethsec
    steps:
      - uses: actions/checkout@v7
      # test.sh builds the test image locally when it is not already present,
      # so the tests do not depend on a published (and possibly private) image.
      - id: test
        run: ./test.sh
