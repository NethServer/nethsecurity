# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Build documentation

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths: ["docs/**", "packages/**/README.md", "packages/python3-nethsec/src/**"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Prepare Pages
        run: |
          cd ./docs
          ./prepare.sh
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      # Generate the python3-nethsec API reference into the built site, so it is
      # published as a subpath of the existing documentation (/apidocs/python3-nethsec/).
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Generate python3-nethsec API documentation
        working-directory: packages/python3-nethsec
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install docutils pydoctor
          pydoctor \
              --project-name=python3-nethsec \
              --project-url=https://github.com/$GITHUB_REPOSITORY \
              --html-viewsource-base=https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA \
              --make-html \
              --html-output="$RUNNER_TEMP/python3-nethsec-apidocs" \
              --project-base-dir="$(pwd)" \
              --docformat=restructuredtext \
              --intersphinx=https://docs.python.org/3/objects.inv \
              ./src/nethsec
          # actions/jekyll-build-pages runs as a root-owned Docker container, so
          # ./_site is root-owned. Write pydoctor's output to a runner-owned temp
          # dir above, then copy it in with sudo instead of writing into _site directly.
          sudo mkdir -p "$GITHUB_WORKSPACE/_site/apidocs"
          sudo cp -r "$RUNNER_TEMP/python3-nethsec-apidocs" "$GITHUB_WORKSPACE/_site/apidocs/python3-nethsec"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
