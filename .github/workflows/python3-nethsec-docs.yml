name: "python3-nethsec apidocs"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/python3-nethsec-docs.yml"
      - "packages/python3-nethsec/src/**"
  pull_request:
    paths:
      - ".github/workflows/python3-nethsec-docs.yml"
      - "packages/python3-nethsec/src/**"

jobs:
  build:
    name: "Build API documentation"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/python3-nethsec
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install requirements for documentation generation
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install docutils pydoctor

      - name: Generate API documentation with pydoctor
        run: |
          pydoctor \
              --project-name=python3-nethsec \
              --project-url=https://github.com/$GITHUB_REPOSITORY \
              --html-viewsource-base=https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA \
              --make-html \
              --html-output=./apidocs \
              --project-base-dir="$(pwd)" \
              --docformat=restructuredtext \
              --intersphinx=https://docs.python.org/3/objects.inv \
              ./src/nethsec

      # NOTE: this repository already publishes its GitHub Pages site from
      # jekyll-gh-pages.yml, and a repository can have only one Pages source.
      # So the API docs are published as a build artifact instead of a second
      # (conflicting) Pages deployment.
      - name: Upload API documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: python3-nethsec-apidocs
          path: packages/python3-nethsec/apidocs
