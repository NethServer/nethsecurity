# netifyd agent status: flow table usage and plugin license status
# netifyd rewrites /var/run/netifyd/status.json every update_interval (15s).

[[inputs.file]]
  files = ["/var/run/netifyd/status.json"]
  interval = "60s"
  data_format = "json_v2"

  [[inputs.file.json_v2]]
    measurement_name = "netifyd"
    [[inputs.file.json_v2.field]]
      path = "flow_count"
    [[inputs.file.json_v2.field]]
      path = "flows_active"
    [[inputs.file.json_v2.field]]
      path = "flows_in_use"
    [[inputs.file.json_v2.field]]
      path = "flows_expiring"
    [[inputs.file.json_v2.field]]
      path = "flows_expired"
    [[inputs.file.json_v2.field]]
      path = "flows_purged"
    # Flows dropped on the lan/wan capture interfaces (10-nfqueue.conf), flow table full or system under load
    [[inputs.file.json_v2.field]]
      path = "stats.lan.flow_dropped"
      rename = "lan_flow_dropped"
    [[inputs.file.json_v2.field]]
      path = "stats.wan.flow_dropped"
      rename = "wan_flow_dropped"

  # license_status_id 3 is "valid"; plugins without a status are skipped
  [[inputs.file.json_v2]]
    measurement_name = "netifyd_plugin"
    [[inputs.file.json_v2.object]]
      path = "plugins.@values"
      included_keys = ["status_license_status_id"]
      tags = ["tag", "status_license_status"]
      [inputs.file.json_v2.object.renames]
        tag = "plugin"
        status_license_status = "license_status"
        status_license_status_id = "license_status_id"

  [inputs.file.tags]
    influxdb_db = "os-metrics"
