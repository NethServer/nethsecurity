# Default Netify Agent Configuration Profile
#
# Copy this file to /etc/netifyd/profiles.d/NN-NAME.conf to create
# a custom configuration profile.
############################################################################

[netifyd]
# Switch to non-root user on start-up.  Requires Linux Capabilities support
# to be enabled at compile time.  When running as a non-root user, the Agent
# will grant itself two capabilities: CAP_NET_ADMIN, CAP_NET_RAW
#user = netify
#group = netify

# On shutdown, force flows to immediately expire?  Otherwise, on shutdown,
# the Agent will linger until all flows have expired and have been purged,
# or a second termination request has been received.
auto_flow_expiry = yes

# The number of "buckets" the main flow map will be divided into.  the
# default is adequate for up to 5,000 flows.  Increasing this value will
# reduce the chances of flow map lock contention on systems that track a
# large number of flows.
flow_map_buckets = 128

# The maxiumum number of bytes to capture (copy) per packet.  Reducing this
# may be appropriate for embedded systems.  Reducing this value too much
# will result in less accurate application/protocol detection.  The maximum
# value is 65535, which is also the default.
max_capture_length = 65535

# The maxiumum number of packets to inspect per flow.  This is a performace
# tuning option for embedded systems.  Reducing this value too much will
# result in less accurate application/protocol detection, specifically TLS.
# Generally, a safe range for adequate detection accuracy would be between
# 15 - 25 packets.
max_detection_pkts = 32

# The maximum number of flows to track at any given moment.  When this value
# has been reached, new flows will stop being tracked until old flows
# expire.  This option can be used to conserve memory on embedded systems,
# or to set an upper safety limit to guard agains DDoS attacks or network
# scanning tools.
max_flows = 0

# Soft-dissectors are flow expressions defined in the application signatures
# configuration file (usually in /etc/netifyd/netify-apps.conf).
# For debugging or for embedded systems with very limited resources, it may
# be helpful to disable Soft-dissectors.
soft_dissectors = yes

# State, cache and configuration files are never truncated and rewritten in
# place: each is written to a temporary file first, which then replaces the
# old version in a single step, so a failed write (a full file system, an
# I/O error, a power cut) leaves the previous version intact.  By default,
# the temporary file is created beside the file it replaces.  Enable this
# option to create it in /tmp instead, and copy it beside the destination
# only once it is complete.  That reduces the writes to persistent storage
# that may not tolerate them well (flash), at the cost of a second copy
# and of room in /tmp (often RAM) for the largest file the Agent or a
# plugin writes.
stage_files_in_tmp = no

# Don't track TCP flows until a SYN+ACK has been captured.  This option can
# offer protection agains network scanners and has the alternative benefit
# of not tracking already established TCP flows when the Agent is first
# started.
syn_scan_protection = no

# How long to wait (in seconds) until an idle flow is scheduled for expiry.
# This time-to-live (TTL) applies to all non-TCP flows.
ttl_idle_flow = 30

# How long to wait (in seconds) until an idle TCP flow is scheduled for
# expiry.
ttl_idle_tcp_flow = 300

# How long to wait (in seconds) for a new flow to show traffic in the
# reply direction before it is expired.  Every new flow starts on this
# "probation" list and leaves it as soon as the far end answers, so a
# port scanner, a misbehaving device, or a SYN/UDP flood can only hold
# a flow table slot for this long instead of ttl_idle_flow.  Set to 0
# to disable the probation list entirely and restore the previous
# behaviour.
#
# A flow that never answers is still promoted rather than expired when
# it is addressed to a multicast or broadcast group, or when it has
# carried at least probation_min_packets -- which is what keeps
# legitimately one-directional traffic (asymmetric routing, a one-way
# SPAN port, an unidirectional media stream) from being chopped into
# short fragments.
ttl_idle_init_flow = 5

# How many packets a flow that has never shown a reply direction must
# carry before it is promoted off the probation list anyway.  A scan
# is many flows of one or two packets each, so it never reaches this;
# a real unidirectional stream passes it almost immediately.
probation_min_packets = 32

# On a capture source that can only ever see one direction -- a one-way
# SPAN or tap, asymmetric routing, an NFQUEUE hook bound to a single
# chain direction -- no flow will ever show a reply, and the probation
# list above would expire everything after ttl_idle_init_flow seconds.
# When enabled, the Agent watches whether an interface carries any
# bidirectional flow at all and disables the probation list on that
# interface alone if it never does, logging the decision.  Setting
# ttl_idle_init_flow = 0 remains the explicit off switch.
#
# One flow seen in both directions settles the question for the life
# of the process; the decision is re-opened by a configuration reload.
probation_auto_disable = yes

# The two floors the auto-disable above must clear before it may
# conclude that an interface can never see a reply: this many flows
# retired on the interface, and this many seconds since the Agent last
# armed the decision (start-up or reload).  Both matter, because only
# one of them is out of a scanner's reach.  Flows are cheap to
# manufacture -- a single 50,000-port scan retires 50,000 of them, and
# a slower scan run for longer reaches any count you pick -- so a
# count alone lets a scan answer the question on the interface's
# behalf and switch the protection off exactly when it is working.
# Wall-clock time cannot be accelerated.  Set probation_sample_time to
# 0 to wait on the flow count alone.
probation_sample_flows = 1000
probation_sample_time = 300

# How often (in seconds) to process the global flow maps.  Flow statistics
# are made available, idle flows are expired, and other house-keeping is
# performed during this update period.  The default of 15s is appropriate
# in most cases.
update_interval = 15

# Periodically call getifaddrs(3) to update the associated IP addresses of
# each capture source, where applicable.  This option is primarily intended
# for non-Linux systems where an on-demand system like Netlink is non
# available.  Should be enabled for FreeBSD and variants.
use_getifaddrs = false

# Attach to an alternate network namespace.  The namespace can be specified
# as a name (/var/run/netns/<name>), or a PID (/proc/<PID>/ns/net), or as a
# full path.
# network_namespace = netify

# Local command/control socket.  Receive commands and control messages on a
# local UNIX socket.
path_server_socket = ${path_state_volatile}/netifyd.sock

# Capture Defaults
############################################################################

[capture-defaults]
# Default capture method for -I and -E command-line options.  Valid types
# include: pcap, tpv3
capture_type = pcap

# Packet capture timeout value (milliseconds).  How long reads from PCAP or
# TPv3 capture sources will wait for packet data before being cancelled and
# retrying.  The default value of 500ms is appropriate in almost all cases.
read_timeout = 500

# Threading Options
##############################################################################
[threads]
# Base CPU ID to start capture threads from.
#capture_base = 0
# Base CPU ID to start detection threads from.
#detection_base = 8
# Number of detection cores to start.
#detection_cores = 8

# Flow Hash Cache
############################################################################

[flow-hash-cache]
# When enabled, a flow's metadata hash along with the detected protocol and
# application ID will be cached for cases where a flow idles longer than the
# set TTL (ttl_idle_flow for non-TCP, and ttl_idle_tcp_flow for TCP).  When
# a flow's activity resumes, it will re-use the old hash and IDs from the
# cache if available.
enable = yes
save = persistent
cache_size = 1000

# DNS Hint Cache
############################################################################

[dns-hint-cache]
enable = yes
partial_lookups = no
save = persistent
cache_size = 1000

# Privacy Filter
############################################################################

[privacy-filter]
private_external_addresses = no

# Netify Informatics/API Integration
# https://www.netify.ai/products/netify-informatics
############################################################################

[netify-api]
# Enable/disable API for app signatures, intel signatures, and more...
enable = no
update_tick = 30
update_interval = 86400
tls_verify = yes
#mtls_enable = no
#ca_file = /path/to/ca.pem
#cert_file = /path/to/cert.pem
#key_file = /path/to/private.key
# Comma-separated list of Netify Intelligence indicator tags whose
# signatures should not be downloaded, to save storage.  Tags are
# case-insensitive, and hyphens are read as underscores.  Unknown tags are
# accepted and have no effect.  The valid tags are listed in the sample
# Netify Intelligence Processor Plugin configuration
# (netify-proc-intel.json), or online at:
#   https://www.netify.ai/documentation/agent/intelligence/catalog
#intel-signatures-ignore = geo,tor_relay,crypto_server

# Protocol Dissector Options
############################################################################

[protocols]
# Enable all DPI protocol dissectors
all = include

# Linux Netlink Options
############################################################################

[netlink]
# Set the user-space buffer size for Netlink messages.  This is the
# buffer the Agent reads one Netlink message into.  A message larger
# than it is dropped by the kernel, and the Agent logs:
#   Netify: messages dropped: the buffer_size of N is too small.
# Minimum: 8192.
buffer_size = 65536
# Set the maximum size the buffer_size above may grow to.
# When a message does not fit, the buffer is enlarged by 2 KB and the
# next message is read into the larger buffer -- up to max_buffer_size,
# or without limit when max_buffer_size is 0.  The growth applies to the
# one socket that saw the truncation and is not written back to this
# file, so a reload returns it to buffer_size.
# To disable automatic resizing, set max_buffer_size equal to
# buffer_size, ex:
#   buffer_size = 65536
#   max_buffer_size = 65536
# A non-zero value below buffer_size is raised to buffer_size.
# Nethesis patch: x5 the buffer_size
max_buffer_size = 327680
# Set the buffer size (1MB default, 8MB for higher traffic spikes)
# for Netlink sockets.  Set to 0 to use the kernel's default.
#
# This is the kernel-side receive queue (SO_RCVBUF), and it is the knob
# for warnings such as:
#   Netify: No buffer space available: messages dropped.
# That is ENOBUFS: the queue overflowed and the kernel discarded
# messages before the Agent could read them.  Raising buffer_size does
# not help -- one read takes one message however large the buffer is --
# so raise socket_buffer_size instead.
socket_buffer_size = 1048576
# In the event we miss a conntrack DESTROY event, clean-up cached flow
# entries that have been idle for greater than this number of seconds.
# Default: 1 hour (3600).  Set to 0 to disable.
conntrack_idle_timeout = 3600

# Enhanced interface metadata using Socket Buffer Marks
############################################################################

[mark-to-interface]
# Enables the logical mapping of packets to their original source
# interface. When enabled, the agent extracts a stored interface index from the
# packet mark (skb mark) to identify the specific logical interface (e.g., a
# wireless VAP) even when packets are captured on a physical bridge or NFQueue handle.
# enable = no

# Specifies the bitwise left-shift used to locate the interface index within the
# 32-bit packet mark. For example, a shift of 8 indicates the index is stored in
# the second byte (bits 8-15), allowing the mark to coexist with other metadata
# like connection marks.
# mark_shift = 8

# Specifies the bitwise mask used to locate the interface index within the
# 32-bit packet mark.
# mark_shift = 8

# Defines the firewall backend used to manage the mapping. When set to nft
# (currently the only mode supported), the agent will automatically synchronize
# the interface-to-mark mappings with the kernel's nftables sets.
# firewall = nft

# Specifies the name of the nftables table where the mapping set is located. The
# agent expects to find (or will attempt to update) a set named according the the
# nft_set configuration parameter within this table to facilitate the correlation
# between physical and logical interfaces.
# nft_table = netify

# A set within the nft_table used to facilitate the correlation between physical
# and logical interfaces.
# nft_set = ifindex_to_mark

