# NethSecurity: nft logs come in over NFLOG and go to syslog, one group per source
#   group 0: fw4, info
#   group 1: banIP, warning
#   group 2: DPI, warning
#   group 3: ns-binding, warning

[global]
logfile="syslog"

plugin="/usr/lib/ulogd/ulogd_inppkt_NFLOG.so"
plugin="/usr/lib/ulogd/ulogd_raw2packet_BASE.so"
plugin="/usr/lib/ulogd/ulogd_filter_IFINDEX.so"
plugin="/usr/lib/ulogd/ulogd_filter_IP2STR.so"
plugin="/usr/lib/ulogd/ulogd_filter_PRINTPKT.so"
plugin="/usr/lib/ulogd/ulogd_output_SYSLOG.so"

stack=fw4:NFLOG,base1:BASE,ifi1:IFINDEX,ip2str1:IP2STR,print1:PRINTPKT,sys_fw4:SYSLOG
stack=banip:NFLOG,base1:BASE,ifi1:IFINDEX,ip2str1:IP2STR,print1:PRINTPKT,sys_banip:SYSLOG
stack=dpi:NFLOG,base1:BASE,ifi1:IFINDEX,ip2str1:IP2STR,print1:PRINTPKT,sys_dpi:SYSLOG
stack=binding:NFLOG,base1:BASE,ifi1:IFINDEX,ip2str1:IP2STR,print1:PRINTPKT,sys_binding:SYSLOG

[fw4]
group=0

[banip]
group=1

[dpi]
group=2

[binding]
group=3

[sys_fw4]
facility=LOG_DAEMON
level=LOG_INFO

[sys_banip]
facility=LOG_DAEMON
level=LOG_WARNING

[sys_dpi]
facility=LOG_DAEMON
level=LOG_WARNING

[sys_binding]
facility=LOG_DAEMON
level=LOG_WARNING
