# ulogd logs every NFLOG group as ulogd: banIP and ns-binding have their own prefix, fw4 is the only group at info
if $.app == "ulogd" then {
    if $.msg startswith "banIP/" then set $.app = "banIP";
    else if $.msg startswith "ns-binding DROP: " then set $.app = "ns-binding";
    else if $.sev == 6 then set $.app = "fw4";
}
