#
# ulogd configuration for ns-audit.
#
# Read by /etc/init.d/ns-audit via `ulogd -c`. It is a private instance:
# the stock /etc/ulogd.conf and /etc/init.d/ulogd are left untouched and
# must stay disabled.
#
# Packets reach this instance through the NFLOG netlink group below, not
# through printk, so nothing is written to the kernel ring buffer or the
# console. Records are handed to syslog, where the rsyslog ruleset shipped
# by victoria-logs forwards them to VictoriaLogs on 127.0.0.1:5514.

[global]
logfile="/var/log/ns-audit-ulogd.log"
loglevel=5

plugin="/usr/lib/ulogd/ulogd_inppkt_NFLOG.so"
plugin="/usr/lib/ulogd/ulogd_raw2packet_BASE.so"
plugin="/usr/lib/ulogd/ulogd_filter_IFINDEX.so"
plugin="/usr/lib/ulogd/ulogd_filter_IP2STR.so"
plugin="/usr/lib/ulogd/ulogd_filter_PRINTPKT.so"
plugin="/usr/lib/ulogd/ulogd_output_SYSLOG.so"

stack=nsaudit:NFLOG,base1:BASE,ifi1:IFINDEX,ip2str1:IP2STR,print1:PRINTPKT,sys1:SYSLOG

# NFLOG input. Group 0 is reserved by the kernel for conntrack invalid
# messages, so ns-audit claims group 1. Matching nftables statement:
#
#   log group 1 prefix "ns-audit "
#
[nsaudit]
group=1
# Queue packets kernel side before waking ulogd, to cut wakeups under load.
netlink_qthreshold=20
netlink_qtimeout=100
netlink_socket_buffer_size=217088
netlink_socket_buffer_maxsize=1085440

# syslog output. The ident is hardcoded to "ulogd" by the plugin, so records
# carry app_name=ulogd in RFC5424 and are queryable in VictoriaLogs with:
#
#   app_name:ulogd
#
[sys1]
facility=LOG_LOCAL3
level=LOG_INFO
