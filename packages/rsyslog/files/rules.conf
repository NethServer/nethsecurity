# Cleaned up fields shared by every output, included before any selector, forwarder or include

# files, same layout as RSYSLOG_TraditionalFileFormat
template(name="ns-file" type="string" string="%TIMESTAMP% %HOSTNAME% %$.tag% %$.msg:::drop-last-lf%\n")
# RFC 3164 forwarders
template(name="ns-rfc3164" type="string" string="<%$.pri%>%TIMESTAMP% %HOSTNAME% %$.tag% %$.msg:::drop-last-lf%")
# RFC 5424 without the trailing newline: Victoria Logs, controller and RFC 5424 forwarders
template(name="ns-rfc5424" type="string"
    string="<%$.pri%>1 %TIMESTAMP:::date-rfc3339% %HOSTNAME% %$.app% %PROCID% %MSGID% %STRUCTURED-DATA% %$.msg:::drop-last-lf%")

# banIP and adblock put their version in the tag
set $.app = re_extract($app-name, "^(banIP|adblock)-", 0, 1, $app-name);
# rsyslog's own messages have no tag
if $.app == "" or $.app == "-" then set $.app = "rsyslogd";
set $.msg = ltrim($msg);
set $.sev = $syslogseverity;
set $.drop = "";

# per-application rules shipped by each package, they can change $.app, $.msg, $.sev and set $.drop
include(file="/etc/rsyslog.d/rules.d/*.conf" mode="optional")

if $.drop != "" then stop
set $.pri = $syslogfacility * 8 + $.sev;
if $procid == "-" then set $.tag = $.app & ":";
else set $.tag = $.app & "[" & $procid & "]:";
