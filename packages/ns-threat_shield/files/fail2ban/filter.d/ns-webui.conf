# Sample: Nov  4 18:15:49 NethSec nethsecurity-api[6042]: [AUTH] authentication failed for user root from 192.168.100.1: exit status 250
# Sample: Nov  4 18:16:02 NethSec nethsecurity-api[6042]: [AUTH] authentication failed for user nobody from 192.168.122.1: exit status 250

[INCLUDES]
before = common.conf

[Definition]
_daemon = nethsecurity-api
failregex = ^%(__prefix_line)s\[AUTH\] authentication failed for user \S+ from <HOST>: exit status \d+$
ignoreregex =
