# Sample: Oct 28 14:47:38 NethSec nethsecurity-api[6042]: nethsecurity_api 2026/10/28 14:47:38 middleware.go:121: [INFO][AUTH] authentication failed for user root from 192.168.100.1: exit status 250
# Sample: Oct 28 15:46:15 NethSec nethsecurity-api[6042]: nethsecurity_api 2026/10/28 15:46:15 middleware.go:121: [INFO][AUTH] authentication failed for user nobody from 192.168.122.1: exit status 250

[INCLUDES]
before = common.conf

[Definition]
_daemon = nethsecurity-api
# Go log prefix of ns-api-server: binds the match to its own lines
_goprefix = nethsecurity_api \d{4}/\d\d/\d\d \d\d:\d\d:\d\d \w+\.go:\d+: \[\w+\]\[AUTH\]
failregex = ^%(__prefix_line)s%(_goprefix)s authentication failed for user \S+ from <HOST>: exit status \d+$
ignoreregex =
