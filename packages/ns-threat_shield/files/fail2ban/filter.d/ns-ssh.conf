# Sample: Oct 25 00:08:44 fw dropbear[27326]: Login attempt for nonexistent user from 203.0.113.7:60416
# Sample: Oct 17 04:13:29 fw dropbear[8198]: Bad password attempt for 'root' from 203.0.113.7:50008
# Sample: Oct 15 11:24:31 fw dropbear[8251]: Exit before auth from <203.0.113.7:52980>: (user 'root', 1 fails): Exited normally
# Sample: Oct 28 17:21:20 fw dropbear[24160]: Exit before auth from <203.0.113.7:51234>: Exited normally
# Sample: Oct 27 14:12:00 fw dropbear[23840]: Exit before auth from <203.0.113.7:47336>: Timeout before auth

[INCLUDES]
before = dropbear.conf

[Definition]
# upstream dropbear patterns, plus any exit before auth: bots often disconnect without trying a password
failregex = %(known/failregex)s
            ^[Ee]xit before auth from \<<ADDR>:\d+\>: .+$
ignoreregex =
