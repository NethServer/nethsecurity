# Sample: Oct 30 07:26:32 NethSec nethsec nginx: 203.0.113.7 - bob [30/Oct/2026:07:26:32 +0000] "GET /api/system HTTP/1.1" 401 50 "-" "curl/8.19.0"
# Sample: Oct 30 07:26:32 NethSec nethsec nginx: 203.0.113.7 - - [30/Oct/2026:07:26:32 +0000] "GET /admin HTTP/1.1" 403 153 "-" "curl/8.19.0"

[INCLUDES]
before = common.conf

[Definition]
_daemon = nginx
# syslog host, optional nginx host, tag, then the client address of the combined access log
_prefix = ^\s*\S+ (?:[^\s:]+ )?%(_daemon)s: <HOST> -
# time and "$request": nginx escapes " in every field, so the first quoted string is the request
_request = \[[^\]"]+\] "[^"]*"
# 401 counts only with a Basic auth user ($remote_user not "-"): other auth schemes are not counted
failregex = %(_prefix)s [^"]+ %(_request)s 403\b
            %(_prefix)s (?!- %(_request)s)[^"]+ %(_request)s 401\b
ignoreregex =
