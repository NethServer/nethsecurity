# Sample: Oct 28 15:44:37 NethSec openvpn(ns_roadwarrior1)[4808]: udp4:192.168.122.1:42475 TLS Auth Error: Auth Username/Password verification failed for peer
# Sample: Oct 28 15:44:45 NethSec openvpn(ns_roadwarrior1)[4808]: udp4:192.168.122.1:58337 TLS Error: TLS handshake failed

[INCLUDES]
before = common.conf

[Definition]
_daemon = openvpn\(ns_roadwarrior\d+\)
# spoofed sources cannot trigger "TLS handshake failed": OpenVPN >= 2.6 answers the first reset statelessly
# VERIFY ERROR is not matched: it is always followed by "TLS handshake failed"
failregex = ^%(__prefix_line)s(?:(?:udp|tcp)\d?(?:-server)?:)?<HOST>:\d+ TLS (?:Auth Error: Auth Username/Password verification failed for peer|Error: TLS handshake failed)$
ignoreregex =
