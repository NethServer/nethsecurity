[DEFAULT]
# fallback for custom jails, the ns-* jails set their own thresholds
maxretry = 3
findtime = 10m
logpath = /var/log/messages
backend = polling
# match IP addresses only, never resolve host names from log lines
usedns = no
# drop all protocols in prerouting: covers the firewall and forwarded traffic, LAN is in ignoreip
ns_banaction = nftables[type=custom, blocktype=drop, chain_hook=prerouting]
banaction = %(ns_banaction)s
banaction_allports = %(ns_banaction)s

[ns-ssh]
maxretry = 5
filter = dropbear
action = %(ns_banaction)s
         ns-insights[scenario=nethsecurity/ssh-bruteforce]

[ns-webui]
maxretry = 8
findtime = 1h
filter = ns-webui
action = %(ns_banaction)s
         ns-insights[scenario=nethsecurity/webui-bruteforce]

[ns-openvpn]
maxretry = 6
filter = ns-openvpn
action = %(ns_banaction)s
         ns-insights[scenario=nethsecurity/openvpn-bruteforce]

[ns-proxy-auth]
maxretry = 6
filter = ns-proxy-auth
action = %(ns_banaction)s
         ns-insights[scenario=nethsecurity/http-auth-bruteforce]

[ns-proxy-scan]
maxretry = 20
findtime = 2m
filter = ns-proxy-scan
action = %(ns_banaction)s
         ns-insights[scenario=nethsecurity/http-scan]
