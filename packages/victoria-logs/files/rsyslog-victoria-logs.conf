# Rsyslog configuration for VictoriaLogs

# RFC 5424 without the trailing newline, using the cleaned up fields set below
template(name="victoria-logs" type="string"
    string="<%$.pri%>1 %TIMESTAMP:::date-rfc3339% %$.host% %$.app% %PROCID% %MSGID% %STRUCTURED-DATA% %$.msg%")

ruleset(name="victoria-logs") {
    # rsyslog uses the FQDN only if DNS answered when it started
    set $.host = field($hostname, 46, 1);
    # banIP and adblock put their version in the tag
    set $.app = re_extract($app-name, "^(banIP|adblock)-", 0, 1, $app-name);
    # rsyslog's own messages have no tag
    if $.app == "" or $.app == "-" then set $.app = "rsyslogd";
    set $.msg = ltrim($msg);
    set $.sev = $syslogseverity;
    set $.drop = "";

    # per-application rules shipped by each package, they can change $.msg, $.sev and set $.drop
    include(file="/etc/rsyslog.d/victoria-logs.d/*.conf" mode="optional")

    set $.pri = $syslogfacility * 8 + $.sev;

    if $.drop == "" then action(
        type="omfwd"
        target="127.0.0.1"
        port="5514"
        protocol="tcp"
        TCP_Framing="octet-counted"
        Template="victoria-logs"

        action.resumeRetryCount="-1"
        queue.type="linkedList"
        queue.size="10000"
        # keep messages queued before victoria-logs starts across rsyslog restarts
        queue.spoolDirectory="/var/spool"
        queue.filename="victorialogsq"
        queue.saveOnShutdown="on"
        queue.maxDiskSpace="10m"
    )
}

*.* call victoria-logs
