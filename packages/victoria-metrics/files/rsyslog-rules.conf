# VictoriaMetrics tools write everything to stderr: take the level from the message and drop its timestamp
if $.app == "victoria-metrics" or $.app == "vmalert" then {
    if re_match($.msg, "^[0-9TZ:.-]+#011") then {
        set $.lvl = re_extract($.msg, "^[^#]+#011([a-z]+)#011", 0, 1, "");
        set $.msg = replace(re_extract($.msg, "^[^#]+#011[a-z]+#011(.*)", 0, 1, $.msg), "#011", " ");
    } else {
        set $.lvl = tolower(re_extract($.msg, "^[0-9/]+ [0-9:]+ ([A-Z]+): ", 0, 1, ""));
        set $.msg = re_extract($.msg, "^[0-9/]+ [0-9:]+ [A-Z]+: (.*)", 0, 1, $.msg);
    }
    if $.lvl == "fatal" or $.lvl == "panic" then set $.sev = 2;
    if $.lvl == "error" then set $.sev = 3;
    if $.lvl == "warn" then set $.sev = 4;
    if $.lvl == "info" then set $.sev = 6;
}
