# telegraf writes everything to stderr: take the level from the message and drop its timestamp
if $.app == "telegraf" then {
    set $.lvl = re_extract($.msg, "^[^ ]+ ([DIWE])! ", 0, 1, "");
    set $.msg = re_extract($.msg, "^[^ ]+ [DIWE]! (.*)", 0, 1, $.msg);
    if $.lvl == "E" then set $.sev = 3;
    if $.lvl == "W" then set $.sev = 4;
    if $.lvl == "I" then set $.sev = 6;
    if $.lvl == "D" then set $.sev = 7;
}
