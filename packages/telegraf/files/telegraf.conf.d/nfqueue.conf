# NFQUEUE backlog per queue (netifyd 50-57, snort 4-5)
# waiting > 0 that doesn't drain means the reader stopped giving verdicts

[[inputs.exec]]
  name_override = "nfqueue"
  commands = [["awk", "BEGIN { printf \"[\" } { printf \"%s{\\\"queue\\\":\\\"%s\\\",\\\"waiting\\\":%s,\\\"queue_dropped\\\":%s,\\\"user_dropped\\\":%s,\\\"id_sequence\\\":%s}\", (NR > 1 ? \",\" : \"\"), $1, $3, $6, $7, $8 } END { print \"]\" }", "/proc/net/netfilter/nfnetlink_queue"]]
  timeout = "5s"
  data_format = "json_v2"

  [[inputs.exec.json_v2]]
    [[inputs.exec.json_v2.object]]
      path = "@this"
      tags = ["queue"]

  [inputs.exec.tags]
    influxdb_db = "os-metrics"
