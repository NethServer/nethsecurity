# Per-process CPU and memory usage
# Filter names match the procd service names used by procd_service.

[[inputs.procstat]]
  interval = "30s"
  properties = ["cpu", "memory"]

  [[inputs.procstat.filter]]
    name = "snort"
    executables = ["/usr/bin/snort"]
  [[inputs.procstat.filter]]
    name = "netifyd"
    executables = ["/usr/sbin/netifyd"]
  [[inputs.procstat.filter]]
    name = "victoria-metrics"
    executables = ["/usr/bin/victoria-metrics"]
  [[inputs.procstat.filter]]
    name = "victoria-logs"
    executables = ["/usr/bin/victoria-logs"]
  [[inputs.procstat.filter]]
    name = "vmalert"
    executables = ["/usr/bin/vmalert"]
  [[inputs.procstat.filter]]
    name = "telegraf"
    executables = ["/usr/bin/telegraf"]
  [[inputs.procstat.filter]]
    name = "ns-flows"
    executables = ["/usr/sbin/ns-flows"]
  [[inputs.procstat.filter]]
    name = "ns-stats"
    executables = ["/usr/sbin/ns-stats"]
  [[inputs.procstat.filter]]
    name = "ns-api-server"
    executables = ["/usr/bin/nethsecurity-api"]
  # fail2ban-server runs under python3
  [[inputs.procstat.filter]]
    name = "fail2ban"
    patterns = ["fail2ban-server"]
  [[inputs.procstat.filter]]
    name = "swanctl"
    executables = ["/usr/lib/ipsec/charon"]
  [[inputs.procstat.filter]]
    name = "odhcpd"
    executables = ["/usr/sbin/odhcpd"]

  [inputs.procstat.tags]
    influxdb_db = "os-metrics"

# Services running more than one process with the same name
[[inputs.procstat]]
  interval = "30s"
  properties = ["cpu", "memory"]
  tag_with = ["pid"]

  [[inputs.procstat.filter]]
    name = "openvpn"
    patterns = ["^/usr/sbin/openvpn "]
  [[inputs.procstat.filter]]
    name = "ns-plug"
    patterns = ["^openvpn /usr/share/ns-plug/client.conf"]
  [[inputs.procstat.filter]]
    name = "dropbear"
    executables = ["/usr/sbin/dropbear"]
  [[inputs.procstat.filter]]
    name = "nginx"
    executables = ["/usr/sbin/nginx"]
  [[inputs.procstat.filter]]
    name = "dnsmasq"
    executables = ["/usr/sbin/dnsmasq"]

  [inputs.procstat.tags]
    influxdb_db = "os-metrics"
